<!doctype html>
<html lang="en">
  <head>
    <script>
      // Resolve theme BEFORE first paint: explicit choice wins, else the OS
      // preference. Applied on <html data-theme> and consumed by styles.css.
      (function () {
        try {
          var stored = localStorage.getItem('aitools.theme')
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.dataset.theme = theme
        } catch (e) { document.documentElement.dataset.theme = 'dark' }
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI Tool Discovery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
