services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aitools-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aitools
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aitools_pgdata:/var/lib/postgresql/data

volumes:
  aitools_pgdata:
